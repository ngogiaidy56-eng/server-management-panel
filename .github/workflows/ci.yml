name: Production CI
on:
  push:
    branches: [main, production-v2, production-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-management-panel-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Syntax, configuration and HTTP security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned direct dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run HTTP, security and RBAC tests
        run: npm test
