name: Production CI
on:
  push:
    branches: [main, production-v2]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Syntax and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test