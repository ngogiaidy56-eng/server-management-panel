services:
  - type: web
    name: server-management-panel
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: server-management-panel-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_ALLOWED_SERVICE_IDS
        sync: false

databases:
  - name: server-management-panel-db
    databaseName: server_management_panel
    user: server_management_panel
    plan: basic-256mb
    region: oregon